# Single source of truth for every frozen choice. Values are set a priori
# (LITERATURE_REVIEW_REPORT.md §9–§13, IMPLEMENTATION_PLAN.md §4) and are
# identical in every cell of the factorial. Ablations override keys explicitly.

dataset:
  name: ds004504
  cite_doi: 10.18112/openneuro.ds004504.v1.0.8   # S3 serves 1.0.9; CHANGES: README-only edit, data identical
  s3_bucket: openneuro.org
  group_to_label: {A: 0, F: 1, C: 2}              # participants.tsv Group codes
  class_names: [AD, FTD, CN]
  channels: [Fp1, Fp2, F3, F4, C3, C4, P3, P4, O1, O2, F7, F8, T3, T4, T5, T6, Fz, Cz, Pz]
  # old 10-20 names -> standard_1020 names (coordinates only)
  channel_rename: {T3: T7, T4: T8, T5: P7, T6: P8}
  task: eyesclosed                                # sub-XXX_task-<task>_eeg.set
  add_reference: null                             # online reference absent from the files (restored as zeros)
  # participants.tsv columns -> internal names. "mmse" holds the dataset's cognitive score (analysis only).
  participant_columns: {participant_id: subject, Gender: sex, Age: age, Group: group, MMSE: mmse}
  qc: {n_subjects: 88, n_windows: [6500, 7100], duration_s: [300, 1300], slowing_check: [AD, CN]}

preprocess:
  l_freq: 0.5
  h_freq: 45.0
  notch: 50.0
  reference: average
  ica_hp: 1.0                 # ICA fit on a 1 Hz high-passed copy
  ica_method: infomax-extended  # the variant ICLabel was trained on
  iclabel_drop: [eye blink, muscle artifact]
  iclabel_threshold: 0.8
  sfreq: 128
  window_s: 10.0

bands:                        # Hz, [lo, hi)
  delta: [0.5, 4.0]
  theta: [4.0, 8.0]
  alpha: [8.0, 13.0]
  beta: [13.0, 30.0]
  gamma: [30.0, 45.0]

features:
  welch_nperseg_s: 2.0
  peak_freq_range: [4.0, 15.0]   # individual alpha/peak frequency (slowing marker)
  dwt_wavelet: db4
  dwt_level: 5
  dwt_keep: [A5, D5, D4, D3, D2]  # D1 (32-64 Hz) lies above the 45 Hz low-pass
  sampen_order: 2
  sampen_r: 0.2
  pswe_local_rate_s: 60.0

pswe:                          # Milikovsky 2019 (10.1126/scitranslmed.aaw8954); params per 10.3390/s23020918
  win_s: 2.0                   # FFT window
  step_s: 1.0                  # 1 s overlap
  mpf_threshold_hz: 6.0
  min_duration_s: 5.0          # "MPF lower than 6 Hz for five consecutive seconds or more"
  fmin: 1.0                    # MPF range: not reported in source; matches our pass-band (sensitivity in A11)
  fmax: 45.0

pswe_relative:                 # EXPLORATORY / POST HOC — defined after the RQ6 result (reports/rq6), fixed
  primary: drop2               # before any real-data run of this analysis; all variants reported
  min_duration_s: 5.0
  variants:
    drop2: {drop_hz: 2.0}      # MPF ≥ 2 Hz below the channel's own recording median, ≥ 5 s
    drop1.5: {drop_hz: 1.5}
    drop3: {drop_hz: 3.0}
    mad2: {mad_k: 2.0}         # MPF < median − 2·(1.4826·MAD)
    mad3: {mad_k: 3.0}

pswe_robust:                   # ROBUSTNESS (added after internal review, fixed before any real-data run): does the
  primary: pad_reject          # fixed-threshold PSWE result depend on the 0.5 Hz MPF grid or on artefacts?
  nfft_s: 8.0                  # zero-padded FFT length: MPF read off a 0.125 Hz grid (window stays 2 s Hann)
  max_ptp_uv: 200.0            # a channel's 2-s segment is rejected if peak-to-peak > 200 µV ...
  min_std_uv: 0.5              # ... or if it is flat (SD < 0.5 µV); rejected seconds break events and leave exposure
  variants:
    original: {pad: false, reject: false}   # must reproduce the main analysis exactly
    pad: {pad: true, reject: false}
    reject: {pad: false, reject: true}
    pad_reject: {pad: true, reject: true}

graph:
  edge: hybrid                 # spatial | functional | hybrid | pswe | identity | random
  functional_band: alpha
  knn_k: 4
  binarize: false

model:
  arch: gcn                    # gcn | gat
  hidden: [64, 32]
  dropout: 0.5
  batchnorm: true

train:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  max_epochs: 200
  patience: 20
  subject_equal_weighting: true
  class_weighting: inverse_frequency

cv:
  n_repeats: 5
  n_folds: 5
  val_frac: 0.2
  seeds: [0, 1, 2, 3, 4]

budget:
  max_hours: 11.0              # Kaggle session limit is 12 h; leave headroom
